<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>my work</title><meta name="description" content="Seu controle pessoal de chamados fechados por dia."><style>
:root {
  color-scheme: light;
  font: 14px/1.45 system-ui, sans-serif;
  color: #25352e;
  background: #f7f9f7;
  --green: #356553;
  --muted: #566b60;
  --line: #dce6de;
  --soft: #edf4ee;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; width: 480px; }
main { max-width: 480px; margin: auto; padding: 16px 14px 24px; }
header, .brand, .connection-actions, .count, .foot {
  display: flex;
  align-items: center;
  gap: 8px;
}
header { justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.brand { gap: 9px; }
.logo {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--soft);
  color: var(--green);
  font-weight: 700;
}
h1 { font-size: 14px; line-height: 1.2; margin: 0; font-weight: 650; }
h2 { font-size: 15px; line-height: 1.3; margin: 0 0 12px; font-weight: 650; }
.counts { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.count {
  width: fit-content;
  margin: 0;
  padding: 3px 9px;
  color: var(--green);
  background: var(--soft);
  border-radius: 999px;
  font-size: 12px;
  gap: 5px;
}
.closed-ticket-list { list-style: none; max-height: 240px; overflow-y: auto; margin: 0; padding: 0; }
.closed-ticket-list li { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; padding: 6px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.count b { font-size: 14px; }
.card {
  padding: 14px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
  margin-bottom: 12px;
}
form { display: grid; gap: 9px; }
label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 550; }
input, button, textarea { font: inherit; border-radius: 8px; }
input, textarea {
  color: inherit;
  width: 100%;
  min-width: 0;
  background: #fcfdfc;
  border: 1px solid var(--line);
  padding: 8px 10px;
}
input, button { min-height: 34px; }
button {
  cursor: pointer;
  border: 1px solid transparent;
  background: var(--green);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
}
button:hover { filter: brightness(.94); }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid #548773; outline-offset: 2px; }
.plain { background: var(--soft); color: var(--green); }
.connection-status, .message, .foot, .empty { color: var(--muted); font-size: 12px; }
.connection-status { margin: 7px 0 0; }
.connection-status:empty, .message:empty { margin: 0; }
.error { color: #a33d35; }
.message { margin-top: 7px; }
.foot { flex-wrap: wrap; justify-content: space-between; margin-top: 9px; }
.foot > div { display: flex; gap: 6px; flex-wrap: wrap; }
#note-status:empty { display: none; }
#notepad { min-height: 90px; resize: vertical; }
#note-history { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 9px; }
#note-history summary { color: var(--muted); font-size: 12px; cursor: pointer; }
#note-history-list { margin-top: 8px; }
#active-ticket-list { list-style:none; padding:0; margin:0; }
#active-ticket-list li { display:flex; align-items:center; gap:8px; margin-top:8px; }
#active-ticket-list li span { flex:1; overflow-wrap:anywhere; }
.goals { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; padding:12px 14px; }
.goals strong { display:block; margin:4px 0; }
.goals progress { display:block; margin:4px 0 0; height:6px; }
.goals small { display:block; margin:0; font-size:10px; line-height:1.3; }
.goals progress,.goals input { width:100%; }
.goals progress { accent-color:#87938a; }
.goals .goal-reached { color:#187044; }
.goals .goal-reached progress { accent-color:#187044; }

.active-ticket-card, [aria-labelledby="notes-heading"] { padding:10px 12px; margin-bottom:8px; }
.active-ticket-card h2, [aria-labelledby="notes-heading"] h2 { font-size:14px; margin-bottom:8px; }
#active-ticket-form { grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:8px; }
#active-ticket-form label { margin-bottom:3px; }
.active-ticket-card input, .active-ticket-card button,
[aria-labelledby="notes-heading"] button { min-height:30px; padding:4px 8px; }
[aria-labelledby="notes-heading"] > div[style] { margin-bottom:6px !important; }
#notepad { min-height:72px; padding:6px 8px; font-size:12px; line-height:1.4; }
[aria-labelledby="notes-heading"] .foot { margin-top:6px; gap:6px; }
#note-history { margin-top:8px; padding-top:6px; }

/* Approved My Work visual design. */
:root {
 color:#24322a;
 background:#f8f8f4;
 --green:#194c30;
 --muted:#657067;
 --line:#dbe0d4;
 --soft:#eef2e9;
 font-family:Inter,"Segoe UI",sans-serif;
}
main { padding:16px 16px 20px; }
header { margin-bottom:12px; }
.brand { gap:9px; }
.brand h1 { font-size:19px; letter-spacing:-.6px; color:#143b25; font-weight:750; }
.logo { background:var(--green); color:white; border-radius:9px; width:31px; height:31px; font-size:19px; }
button { border-radius:7px; font-weight:600; transition:background .15s; }
#reconnect { background:var(--green); color:white; }
.counts { gap:7px; margin:10px 0 12px; }
.count { background:#f1f3ec; border:1px solid #e2e6db; color:#304c38; border-radius:7px; padding:5px 8px; font-size:11px; }
.count b { font-size:14px; }
#closed-toggle { color:#8b602e; background:transparent; padding:4px; margin-left:auto; font-size:11px; }
.card { border-color:var(--line); background:#fffefa; box-shadow:0 2px 5px #24322a04; border-radius:11px; }
h2 { color:#213c2b; letter-spacing:-.2px; }
.goals { padding:11px 13px; gap:8px 16px; }
.goals > div + div { border-left:1px solid var(--line); padding-left:15px; }
.goals > div > span { font-size:11px; font-weight:600; color:#4f5c51; }
.goals strong { font-size:19px; line-height:1.25; font-weight:650; letter-spacing:-.5px; margin:4px 0 6px; }
.goals progress { height:5px; border:0; border-radius:5px; overflow:hidden; background:#e4e8df; accent-color:#8d988b; }
.goals progress::-webkit-progress-bar { background:#e4e8df; border-radius:5px; }
.goals progress::-webkit-progress-value { background:#8d988b; border-radius:5px; }
.goals .goal-reached strong { color:#187044; }
.goals .goal-reached progress::-webkit-progress-value { background:#187044; }
.goals small { color:#7a8276; font-size:9px; }
.active-ticket-card, [aria-labelledby="notes-heading"] { padding:12px; }
.active-ticket-card h2, [aria-labelledby="notes-heading"] h2 { font-size:14px; margin-bottom:10px; }
input, textarea { background:#fff; border-color:#d5ddd0; border-radius:7px; }
input:focus, textarea:focus { border-color:#598065; }
#active-ticket-form { gap:8px; }
#active-ticket-number { height:32px; }
#start-ticket { height:32px; padding-inline:16px; }
#active-ticket-list li { border-radius:7px; background:#f0f3eb; padding:7px 8px; gap:8px; font-size:12px; }
#active-ticket-list li span { color:#244b30; font-weight:650; }
#active-ticket-list button { font-size:11px; min-height:28px; }
#active-ticket-list .plain { background:transparent; color:#6a7066; padding-inline:3px; }
#note-template { color:#92632f; background:transparent; min-height:28px; }
#note-label { font-size:11px; color:#5c685d; }
#notepad { min-height:84px; font-size:12px; line-height:1.55; padding:8px 9px; }
.foot { font-size:10px; }
#note-status { color:#73806d; }
#note-status.error { color:#a33d35; }
#note-history { margin-top:10px; padding-top:8px; }
#note-history > summary { color:#314d39; font-weight:600; font-size:12px; }
#note-count { color:#778271; font-weight:400; }
#note-history-list > div { border-bottom:1px solid #edf0e8; }
#note-history-list > div > button { background:transparent; color:#346040; font-size:11px; }
#note-history-list details { border-top:0 !important; }
#note-history-list summary { color:#304b38 !important; }
#note-search { min-height:30px; font-size:12px; padding:5px 8px; }
.goals { grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 10px; }
.goals > div + div { padding-left:0; border-left:0; }
.goals .goal-settings { grid-column:1 / -1; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.goal-settings label { margin:0; }
.goal-settings select { font:inherit; font-size:12px; padding:4px 7px; border:1px solid var(--line); border-radius:6px; background:white; color:inherit; }
#fixed-goal-field { display:flex; align-items:center; gap:6px; }
#fixed-goal { width:70px; min-height:28px; padding:3px 6px; }
.goals strong { font-size:17px; }
.goal-settings-panel { grid-column:1 / -1; }
.goal-settings-panel > summary { cursor:pointer; color:var(--muted); font-size:11px; }
.goal-settings-panel .goal-settings { margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

main { padding-top:10px; }
header { margin-bottom:6px; gap:6px; }
.brand { gap:7px; }
.brand h1 { font-size:15px; letter-spacing:-.3px; }
.logo { width:24px; height:24px; border-radius:7px; font-size:15px; }
#reconnect { min-height:26px; padding:3px 9px; font-size:11px; }
[aria-labelledby="notes-heading"] h2 { margin-bottom:2px; }

.view-switch { display:flex; gap:4px; padding:3px; margin:10px 0; background:var(--soft); border-radius:8px; }
.view-switch button { flex:1; background:transparent; color:var(--green); }
.view-switch button[aria-pressed="true"] { background:var(--green); color:white; }
body[data-view="counters"] .registration-content,
body[data-view="counters"] #closed-toggle,
body[data-view="counters"] #closed-tickets { display:none; }
body[data-view="counters"] .counts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
body[data-view="counters"] .count { width:100%; flex-direction:column; text-align:center; padding:16px 8px; gap:5px; }
body[data-view="counters"] .count b { font-size:28px; }
</style></head><body>
<main>
  <header>
    <div class="brand"><span class="logo" aria-hidden="true">✓</span><h1>My Work</h1></div>
    <div class="connection-actions"><button id="open-site" type="button" hidden>Entrar</button><button id="reconnect" class="plain" type="button">Atualizar</button></div>
  </header>
  <p id="connection-status" class="connection-status" role="status" aria-live="polite">Conectando…</p>
  <nav class="view-switch" aria-label="Visualização da extensão"><button id="view-registration" type="button" aria-pressed="true">Registro</button><button id="view-counters" type="button" aria-pressed="false">Contadores</button></nav>
  <div id="workspace">
    <div class="counts"><div class="count"><b id="todayCount">–</b><span>fechados hoje</span></div><div class="count"><b id="weekCount">–</b><span>fechados na semana</span></div><div class="count"><b id="monthCount">–</b><span>fechados no mês</span></div><button id="closed-toggle" class="plain" type="button" aria-expanded="false" aria-controls="closed-tickets">Ver fechados</button></div>
    <section class="card goals registration-content" aria-label="Metas de chamados fechados">
 <details class="goal-settings-panel"><summary>Configurar metas</summary><div class="goal-settings"><label for="goal-mode">Meta</label><select id="goal-mode"><option value="variable">Variável</option><option value="fixed">Fixa</option></select><label id="fixed-goal-field" hidden>Tickets por dia <input id="fixed-goal" type="number" min="1" max="100000" step="1" required></label></div></details>
 <div><span>Meta diária</span><strong id="daily-goal-status" aria-live="polite"></strong><progress id="daily-progress" aria-label="Progresso da meta diária"></progress></div>
 <div><span title="Segunda a domingo">Meta semanal</span><strong id="weekly-goal-status" aria-live="polite"></strong><progress id="weekly-progress" aria-label="Progresso da meta semanal"></progress></div>
 <div><span>Meta mensal</span><strong id="monthly-goal-status" aria-live="polite"></strong><progress id="monthly-progress" aria-label="Progresso da meta mensal"></progress></div><small id="goal-description" style="grid-column:1 / -1"></small></section>
    <section id="closed-tickets" class="card" aria-labelledby="closed-heading" hidden><h2 id="closed-heading">Chamados fechados</h2><p id="closed-status" class="message" role="status" hidden></p><ul id="closed-list" class="closed-ticket-list"></ul></section>
    <section class="card active-ticket-card registration-content"><h2>Tickets em atendimento</h2><form id="active-ticket-form"><div><label for="active-ticket-number">Número do ticket</label><input id="active-ticket-number" placeholder="Ex.: 123456" maxlength="100" required autocomplete="off"></div><button id="start-ticket" type="submit">Iniciar</button></form><ul id="active-ticket-list"></ul><div id="message" class="message" role="status"></div><div id="active-ticket-status" class="message" role="status"></div></section><section class="card registration-content" aria-labelledby="notes-heading"><h2 id="notes-heading">Bloco de notas</h2><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px"><label id="note-label" for="notepad" style="margin:0">Nova anotação</label><button type="button" id="note-template" class="plain" disabled>＋ Inserir modelo</button></div><textarea id="notepad" rows="3" maxlength="100000" placeholder="Escreva uma nova anotação…" disabled></textarea><div class="foot"><span id="note-status" role="status" aria-live="polite"></span><div><button id="note-retry" class="plain" type="button">Tentar novamente</button> <button id="note-cancel" class="plain" type="button" hidden>Cancelar edição</button> <button id="note-save" type="button" disabled>Salvar anotação</button></div></div><details id="note-history"><summary>Histórico <span id="note-count">(0)</span></summary><div style="margin:12px 0"><label for="note-search">Buscar por solicitante</label><input type="search" id="note-search" placeholder="Digite o nome" autocomplete="off" style="width:100%"></div><div id="note-history-list"></div></details></section></div></main><script type="module" src="./app.js"></script></body></html>
