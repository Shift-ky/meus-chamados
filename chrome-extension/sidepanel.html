<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>my work</title><meta name="description" content="Seu controle pessoal de chamados fechados por dia."><style>
:root {
  color-scheme: light;
  font: 14px/1.45 system-ui, sans-serif;
  color: #25352e;
  background: #f7f9f7;
  --green: #356553;
  --muted: #566b60;
  --line: #dce6de;
  --soft: #edf4ee;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
main { max-width: 500px; margin: auto; padding: 16px 14px 24px; }
header, .brand, .connection-actions, .count, .foot, .filter {
  display: flex;
  align-items: center;
  gap: 8px;
}
header { justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.brand { gap: 9px; }
.logo {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--soft);
  color: var(--green);
  font-weight: 700;
}
h1 { font-size: 18px; line-height: 1.2; margin: 0; font-weight: 650; }
h2 { font-size: 15px; line-height: 1.3; margin: 0 0 12px; font-weight: 650; }
.count {
  width: fit-content;
  margin: 10px 0 14px;
  padding: 3px 9px;
  color: var(--green);
  background: var(--soft);
  border-radius: 999px;
  font-size: 12px;
  gap: 5px;
}
.count b { font-size: 14px; }
.card {
  padding: 14px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
  margin-bottom: 12px;
}
form { display: grid; gap: 9px; }
label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 550; }
input, button, textarea { font: inherit; border-radius: 8px; }
input, textarea {
  color: inherit;
  width: 100%;
  min-width: 0;
  background: #fcfdfc;
  border: 1px solid var(--line);
  padding: 8px 10px;
}
input, button { min-height: 34px; }
button {
  cursor: pointer;
  border: 1px solid transparent;
  background: var(--green);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
}
button:hover { filter: brightness(.94); }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid #548773; outline-offset: 2px; }
.plain { background: var(--soft); color: var(--green); }
.connection-status, .message, .foot, .empty { color: var(--muted); font-size: 12px; }
.connection-status { margin: 7px 0 0; }
.connection-status:empty, .message:empty { margin: 0; }
.error { color: #a33d35; }
.message { margin-top: 7px; }
.foot { flex-wrap: wrap; justify-content: space-between; margin-top: 9px; }
.foot > div { display: flex; gap: 6px; flex-wrap: wrap; }
#note-status:empty { display: none; }
#notepad { min-height: 90px; resize: vertical; }
#note-history { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 9px; }
#note-history summary { color: var(--muted); font-size: 12px; cursor: pointer; }
#note-history-list { margin-top: 8px; }
#ticket-details summary { cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; list-style: none; }
#ticket-details summary::-webkit-details-marker { display: none; }
#ticket-details summary .plain { padding: 4px 7px; border-radius: 6px; font-size: 11px; text-align: center; }
#ticket-details .tickets-close, #ticket-details[open] .tickets-open { display: none; }
#ticket-details[open] .tickets-close { display: inline; }
.toolbar { margin-top: 12px; }
.filter { flex-wrap: wrap; gap: 6px; }
.filter input { width: min(145px, 100%); }
ul { list-style: none; margin: 9px 0 0; padding: 0; }
li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.ticket { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ticket small { display: block; color: var(--muted); }
.tick { color: var(--green); }
.badge { display: none; }
.remove { color: var(--muted); background: transparent; font-size: 16px; }
.empty { text-align: center; padding: 14px 0; }
.empty strong { display: block; }
</style></head><body>
<main>
  <header>
    <div class="brand"><span class="logo" aria-hidden="true">✓</span><h1>My Work</h1></div>
    <div class="connection-actions"><button id="open-site" type="button" hidden>Entrar</button><button id="reconnect" class="plain" type="button">Atualizar</button></div>
  </header>
  <p id="connection-status" class="connection-status" role="status" aria-live="polite">Conectando…</p>
  <div id="workspace">
    <div class="count"><b id="todayCount">–</b><span>fechados hoje</span></div>
    <section class="card"><h2>Registrar chamado</h2><form id="form"><div><label for="number">Número do ticket</label><input id="number" placeholder="Ex.: 123456" maxlength="100" required autocomplete="off"></div><div><label for="date">Data de fechamento</label><input type="date" id="date" required></div><button type="submit">Registrar</button></form><div id="message" class="message" role="status" aria-live="polite"></div></section><section class="card" aria-labelledby="notes-heading"><h2 id="notes-heading">Bloco de notas</h2><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px"><label id="note-label" for="notepad" style="margin:0">Nova anotação</label><button type="button" id="note-template" class="plain" disabled>＋ Inserir modelo</button></div><textarea id="notepad" rows="3" maxlength="100000" placeholder="Escreva uma nova anotação…" disabled></textarea><div class="foot"><span id="note-status" role="status" aria-live="polite"></span><div><button id="note-retry" class="plain" type="button">Tentar novamente</button> <button id="note-cancel" class="plain" type="button" hidden>Cancelar edição</button> <button id="note-save" type="button" disabled>Salvar anotação</button></div></div><details id="note-history"><summary>Histórico <span id="note-count">(0)</span></summary><div id="note-history-list"></div></details></section><section class="card"><details id="ticket-details"><summary style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;list-style:none"><h2 style="margin:0">Chamados registrados <small id="total" style="color:#8c9990;font-weight:400"></small></h2><span class="plain"><span class="tickets-open">Abrir lista</span><span class="tickets-close">Recolher</span></span></summary><div class="toolbar"><div class="filter"><label for="filter" style="margin:0">Dia</label><input id="filter" type="date" aria-label="Filtrar por dia"><button class="plain" id="all">Ver todos</button><button class="plain" id="refresh">Atualizar</button></div></div><ul id="list"></ul><div class="empty" id="empty"><div style="font-size:30px;opacity:.5">▤</div><strong>Nenhum chamado por aqui ainda</strong><span>Registre seu primeiro ticket no campo acima.</span></div><div class="foot"><span id="summary"></span><div><input id="import-file" type="file" accept=".csv,text/csv" hidden><button class="plain" id="import">↑ Importar CSV</button> <button class="plain" id="export">↓ Exportar CSV</button></div></div></details></section></div></main><script type="module" src="./app.js"></script></body></html>
